{{- $seo := .seo -}}
{{- $page := .page -}}
{{- $site := $page.Site -}}
{{- $siteURL := $site.BaseURL -}}
{{- $author := $site.Params.author | default $site.Title -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ $siteURL }}#website",
      "url": "{{ $siteURL }}",
      "name": "{{ $site.Title }}",
      "alternateName": "{{ $site.Params.description }}",
      "description": "{{ $site.Params.description }}",
      "author": { "@type": "Person", "name": "{{ $author }}" },
      "inLanguage": "{{ $site.Language.Locale }}",
      "publisher": { "@id": "{{ $siteURL }}#person" }
    }{{ if not $page.IsHome }},
    {
      "@type": "Article",
      "@id": "{{ $page.Permalink }}#article",
      "isPartOf": { "@id": "{{ $siteURL }}#website" },
      "mainEntityOfPage": { "@type": "WebPage", "@id": "{{ $page.Permalink }}" },
      "headline": "{{ $page.Title }}",
      {{- with $page.PublishDate }}
      "datePublished": "{{ .Format "2006-01-02T15:04:05-07:00" }}",
      {{- end }}
      {{- with $page.Lastmod }}
      "dateModified": "{{ .Format "2006-01-02T15:04:05-07:00" }}",
      {{- end }}
      "description": "{{ $seo.description }}",
      {{- with $page.Params.image }}
      "image": { "@type": "ImageObject", "url": "{{ . | absURL }}" },
      {{- end }}
      "author": { "@type": "Person", "name": "{{ $author }}" },
      "publisher": { "@type": "Organization", "name": "{{ $site.Title }}" },
      "inLanguage": "{{ $site.Language.Locale }}"
    }{{ end }}
  ]
}
</script>
