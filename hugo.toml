# ========== 站点基本信息 ==========

# 站点域名（当前主域：GitHub Pages 自定义域名 zhikuji.bbroot.com），
# 用于生成站点的绝对链接、canonical 和 sitemap。
# 注意：必须先保证浏览器实际访问的地址与 baseURL 一致，否则搜索引擎
# 会因 canonical 指向与访问域名不符而拒绝收录。
baseURL = "https://zhikuji.bbroot.com"

# 站点名称，显示在浏览器标签页和页头
title = "知库集"

# 作者名，会显示在页面底部版权处
author = "zlf1103"

# 站点语言（影响 <html lang> 属性、日期格式等），中文站点用 zh-cn
locale = "zh-cn"

# 默认内容语言，与 languageCode 保持一致，Hugo 会优先读取该语言的内容
DefaultContentLanguage = "zh-cn"

# 允许在 Markdown 中使用 HTML 短代码（如 <iframe>、<video> 等）
enableInlineShortcodes = true

# 使用的 Hugo 主题名称，对应 themes/ 目录下的主题
theme = "Blonde"

# 自动生成 robots.txt，方便搜索引擎收录
enableRobotsTXT = true

# 站点包含中文/日文/韩文内容时开启，Hugo 会按中文分词（影响摘要截断、字数统计、阅读时间）
hasCJKLanguage = true

# ========== 第三方服务 ==========

[services]
  [services.googleAnalytics]
  # 启用 Google Analytics 统计（填入你的跟踪 ID 后取消注释）
  #id = "G-1234567890"

  [services.disqus]
  # Disqus 评论系统（填入你的 shortname 后取消注释）
  #shortname = "your-disqus-shortname"

# ========== 主题参数 ==========

[params]
# 网站主题色（Tailwind CSS 背景色类名），默认为深灰色
# https://tailwindcss.com/docs/background-color
base_color = "bg-gray-800"

# 站点描述，显示在页头副标题、SEO meta description
description = "精心挑选、严格测试的虚拟资源分享中心，涵盖软件工具、模板素材、主题插件等。"

# 每篇文章可选填的资源元信息（写在文章 front matter 中）：
#   resource_version: "1.0.0"    资源版本号
#   resource_size: "15.6 MB"     资源大小
#   resource_language: "简体中文" 界面语言
#   download: "https://..."      下载链接（不填则显示"联系获取"按钮）

# 每页显示的文章数量（首页分页）
paginator_pages = 5

# 归档列表是否使用下拉折叠样式（true/false）
archive_dropdown = "false"

# 侧边栏标签栏最多显示的标签数量
tagsLimit = 20

# 侧边栏"最近文章"显示的数量
recentLimit = 5

# 默认主题模式：dark = 深色，light = 浅色
darkmode = "light"

# Logo 图片路径（相对 static/ 或绝对 URL）。
# 设置后，页头用图片代替文字标题。
# logo = "/img/logo.png"

# 站点默认社交分享图（相对 static/ 或绝对 URL）。
# 文章没有设置 image 字段时，社交平台分享会用这张图。
# og_image = "/img/og-cover.png"

  [params.seo]
  # 启用 JSON-LD 结构化数据（WebSite + Article），利于搜索引擎富摘要
  jsonld = true
  # 百度搜索资源平台验证代码（ziyuan.baidu.com 注册后获取，填入后自动输出验证 meta 标签）
  baidu_verification = ""
  # 必应站长工具验证代码（bing.com/webmasters 注册后获取，填入后自动输出验证 meta 标签）
  bing_verification = "BDABC9551D9ECE43198C3D17D8744D24"
  # 首页 title（浏览器标签页/搜索结果显示的标题）。
  # 首页默认直接用 site.title（太短不利于 SEO），可在此覆盖为更完整的标题
  home_title = "知库集 - 精选软件工具与虚拟资源分享站"

  [params.ad]
  # Google AdSense 广告配置（默认关闭，填入后可开启广告位）
  googleAdSense = ""

  # 广告位 ID
  adslot = ""

  # 是否在文章顶部显示广告
  postTop = false

  # 是否在文章底部显示广告
  postBottom = false

  [params.post]
  # 文章列表是否显示缩略图
  thumbnail = true

  # 文章没有封面图时，是否显示默认的 "NO IMAGE" 占位图
  noimage = true

  # 缩略图高度（Tailwind CSS 类）
  # https://tailwindcss.com/docs/height
  thumbnail_height = "lg:h-44"

  # 缩略图宽度（Tailwind CSS 类）
  # https://tailwindcss.com/docs/width
  thumbnail_width = "lg:w-auto"

  # 文章列表摘要显示的字数
  description = "130"

  [params.widgets]
  # 是否显示侧边栏小组件
  display = true

  # 移动端是否也显示小组件（默认 false = 仅桌面显示）
  mobile = true

  # 侧边栏小组件的显示顺序，可调整或删减
  # 注意："tags"（标签）、"social"（社交链接）和 "archive"（归档）
  # 已暂时停用，想恢复时把对应项加回数组中即可
  widgets = [
    "search",
    "category",
    # "archive", # 归档模块暂时隐藏，恢复时取消注释
    "recent",
  ]

  [params.giscus]
  # Giscus 评论系统（基于 GitHub Discussions，见 https://giscus.app 获取配置）
  #repo = "your-repo"
  #repo_id = "your-repo-id"
  #category = "Announcements"
  #category_id = "your-category-id"
  #mapping = "pathname"
  #strict = "0"
  #reactions_enabled = "1"
  #emit_metadata = "0"
  #input_position = "bottom"
  #theme = "preferred_color_scheme"
  #lang = "en"
  #loading = "lazy"

  [params.share]
  # 是否在文章底部显示分享按钮
  enable = true
  # 取消注释可限制只显示指定平台的分享按钮
  # services = ["twitter", "facebook", "line", "linkedin", "whatsapp", "mail", "copy"]

  # 侧边栏社交链接（图标可选：github, twitter-x, bluesky, youtube, instagram,
  # facebook, linkedin, mastodon, threads, tiktok, twitch, line, whatsapp,
  # steam, vimeo, wechat, sina-weibo, mail, globe）
  [[params.social]]
  name = "GitHub"
  url = "https://github.com/zlf1103"
  icon = "github"

  [[params.social]]
  name = "Twitter / X"
  url = "https://x.com/zlf1103"
  icon = "twitter-x"

  [[params.social]]
  name = "YouTube"
  url = "https://www.youtube.com/@zlf1103"
  icon = "youtube"

# ========== 顶部导航菜单 ==========

[menu]
  [[menu.main]]
  identifier = "home"   # 菜单项唯一标识
  name = "首页"          # 菜单显示的文字
  url = "/"             # 链接地址
  weight = 1            # 排序权重，越小越靠前

  [[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 2

  [[menu.main]]
  identifier = "contact"
  name = "联系"
  url = "/contact/"
  weight = 3

# ========== 输出格式 ==========

[outputs]
  # 首页额外输出 JSON（文章索引），供站内本地搜索使用
  home = ["HTML", "RSS", "JSON"]

# ========== Sitemap 配置 ==========

[sitemap]
  # 页面在 sitemap.xml 中的默认更新频率与优先级
  changefreq = "weekly"
  priority = 0.5

# ========== 分类系统 ==========

[taxonomies]
# 定义三类归档方式：分类、标签、按时间归档
category = "categories"
tag = "tags"
archive = "archives"

# ========== 隐私设置（第三方嵌入） ==========

[privacy]
  [privacy.vimeo]
  disabled = false
  simple = true

  [privacy.x]
  disabled = false
  enableDNT = true
  simple = true

  [privacy.instagram]
  disabled = false
  simple = true

  [privacy.youtube]
  disabled = false
  privacyEnhanced = true

# ========== Markdown 渲染 ==========

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
    # 允许 Markdown 中直接使用 HTML 标签（如 <div>、<iframe>）
    unsafe = true

# ========== 压缩配置 ==========

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
    # 保留 HTML 属性引号（必应/百度站长工具的验证 meta 标签
    # 要求标准带引号格式，否则验证器可能匹配不到）
    keepQuotes = true

# ========== 构建配置 ==========

[build]
  [build.buildStats]
  # 生成构建统计，供 Tailwind 自动清理未使用的样式
  enable = true
  [[build.cachebusters]]
  source = 'assets/notwatching/hugo_stats\.json'
  target = 'css'

# ========== 安全设置（允许执行的外部命令） ==========

[security]
  [security.exec]
  # 允许 Hugo 调用的构建工具
  allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']

# ========== 模块挂载 ==========

[module]
  [[module.mounts]]
  source = 'assets'
  target = 'assets'

  [[module.mounts]]
  disableWatch = true
  source = 'hugo_stats.json'
  target = 'assets/notwatching/hugo_stats.json'
