# .github/workflows/hugo.yaml
name: Build and deploy Hugo site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.165.0 # 请将此版本号修改为你使用的 Hugo 版本
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        id: build
        continue-on-error: true
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          hugo \
            --gc \
            --minify \
            -e production \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Diagnose build failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::HUGO_VERSION=$(hugo version)"
          echo "::error::THEME_DIR: $(ls themes/Blonde 2>&1 | tr '\n' ' ' | cut -c1-120)"
          hugo --gc --minify -e production --baseURL "${{ steps.pages.outputs.base_url }}/" 2>&1 | tail -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Fail build job
        if: steps.build.outcome == 'failure'
        run: exit 1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4